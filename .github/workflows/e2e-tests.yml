name: E2E Tests
on:
    workflow_dispatch:
        inputs:
            browser:
                description: 'Escolha o navegador de sua preferência para os testes (Chromium, Firefox, Webkit)'
                required: true
                default: 'chromium'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Node Setup
      uses: actions/setup-node@v6

      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci

    - name: Install E2E Browsers
      run: npx playwright install --with-deps ${{ github.inputs.browser }}

    - name: Run Playwright tests
      run: npx playwright test --project=${{ github.inputs.browser }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.inputs.browser }}
        path: playwright-report/
        retention-days: 30